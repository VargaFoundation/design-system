name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Pour republier la vitrine sans nouveau commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sans `version` : l'action lit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Les feuilles générées correspondent aux jetons, et les composants se typent.
      - run: pnpm check
      # La vitrine se construit depuis les vrais composants : si elle casse, un consommateur
      # casserait aussi.
      - run: pnpm showcase
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { path: docs }

  # La vitrine publiée : https://vargafoundation.github.io/design-system/
  pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
